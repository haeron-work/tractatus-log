<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tractatus Log & Scratchpad</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --dim-color: #888888;
      --accent-color: #000000;
      --border-color: #e0e0e0;
      --danger-color: #d93838;
      --line-height: 1.8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --dim-color: #666666;
        --accent-color: #4ea8de;
        --border-color: #2a2a2a;
        --danger-color: #ff5555;
      }
    }

    body {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: var(--line-height);
    }

    /* Minimal Folder Switcher Tabs */
    nav.folder-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    nav.folder-tabs button {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--dim-color);
      cursor: pointer;
      padding: 0;
    }
    nav.folder-tabs button.active {
      color: var(--text-color);
      font-weight: bold;
      text-decoration: underline;
    }
    nav.folder-tabs button.tab-trash.active {
      color: var(--danger-color);
    }

    /* Minimal Editor */
    .editor-box {
      border: 1px dashed var(--dim-color);
      padding: 15px;
      margin-bottom: 40px;
      border-radius: 2px;
    }
    .editor-box input, .editor-box textarea, .editor-box button {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    .editor-box button {
      background: var(--text-color);
      color: var(--bg-color);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 4px;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--dim-color);
      margin-bottom: 8px;
    }

    /* Log Stream Item */
    .log-item {
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      padding-left: calc(var(--indent, 0) * 22px);
    }
    .log-meta {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 12px;
      line-height: 1.2;
      flex-shrink: 0;
      margin-top: 3px;
      user-select: none;
    }
    .log-id { font-size: 0.7rem; color: var(--accent-color); font-weight: bold; }
    .log-date { font-size: 0.55rem; color: var(--dim-color); }
    .log-content { font-size: 0.95rem; flex-grow: 1; }
    
    /* Action Buttons */
    .action-group {
      display: inline-block;
      margin-left: 8px;
    }
    .action-btn {
      background: none;
      border: none;
      color: var(--dim-color);
      font-size: 0.65rem;
      cursor: pointer;
      padding: 0 3px;
      opacity: 0.35;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .log-item:hover .action-btn { opacity: 1; }
    
    /* Red text for delete buttons */
    .action-btn.delete-btn {
      color: var(--danger-color);
    }
  </style>
</head>
<body>

  <!-- Minimal Folder Navigation -->
  <nav class="folder-tabs">
    <button id="tab-all" class="active" onclick="switchFolder('all')">[ ALL ]</button>
    <button id="tab-tractatus" onclick="switchFolder('tractatus')">[ TRACTATUS ]</button>
    <button id="tab-scratchpad" onclick="switchFolder('scratchpad')">[ SCRATCHPAD ]</button>
    <button id="tab-trash" class="tab-trash" onclick="switchFolder('trash')">[ TRASH ]</button>
  </nav>

  <!-- Editor Section -->
  <section class="editor-box">
    <div class="editor-header">
      <span id="editor-title">NEW ENTRY</span>
      <span id="cancel-edit" style="display:none; cursor:pointer;" onclick="resetEditor()">[ Cancel Edit ]</span>
    </div>
    <input type="hidden" id="editingUid" value="" />
    <input type="password" id="secretCode" placeholder="Secret Key" />
    <input type="text" id="logId" placeholder="No. (e.g. 1.11 — leave blank for Scratchpad)" />
    <textarea id="logContent" rows="3" placeholder="Write an idea or note..."></textarea>
    <button onclick="saveLog()" id="submitBtn">Publish Entry</button>
  </section>

  <!-- Timeline Stream -->
  <main id="logStream"></main>

  <script>
    // 🔴 [CONFIG] Replace with your actual URLs/Info
    const WORKER_URL = "https://log-proxy.본인아이디.workers.dev";
    const GITHUB_USERNAME = "본인깃허브아이디";
    const GITHUB_REPO = "tractatus-log";

    let allLogs = [];
    let currentFolder = 'all';

    document.addEventListener("DOMContentLoaded", fetchLogs);

    async function fetchLogs() {
      const dataUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/logs.json`;
      try {
        const res = await fetch(dataUrl + `?t=${new Date().getTime()}`);
        if (!res.ok) return;
        const data = await res.json();
        
        // Ensure legacy items have unique uid and deleted flag
        allLogs = data.map((item, idx) => ({
          uid: item.uid || `legacy_${idx}_${Date.now()}`,
          id: item.id || '',
          content: item.content || '',
          date: item.date || '',
          updatedAt: item.updatedAt || null,
          deleted: !!item.deleted
        }));

        renderStream();
      } catch (e) {
        console.error("Failed to load logs.", e);
      }
    }

    function switchFolder(folder) {
      currentFolder = folder;
      document.querySelectorAll('.folder-tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${folder}`).classList.add('active');
      renderStream();
    }

    function renderStream() {
      const stream = document.getElementById('logStream');
      stream.innerHTML = '';

      const filteredLogs = allLogs.filter(log => {
        if (currentFolder === 'trash') return log.deleted; // TRASH TAB: deleted items only
        if (log.deleted) return false; // Hide deleted items in non-trash tabs

        const isTractatus = log.id && log.id.trim() !== '';
        if (currentFolder === 'tractatus') return isTractatus;
        if (currentFolder === 'scratchpad') return !isTractatus;
        return true; // 'all'
      });

      if (filteredLogs.length === 0) {
        stream.innerHTML = `<div style="color: var(--dim-color); font-size: 0.85rem;">(No entries found)</div>`;
        return;
      }

      filteredLogs.forEach(log => {
        const isTractatus = log.id && log.id.trim() !== '';
        const dotCount = isTractatus ? (log.id.match(/\./g) || []).length : 0;
        const displayDate = log.updatedAt ? `upd ${log.updatedAt}` : log.date;

        const article = document.createElement('article');
        article.className = 'log-item';
        article.style.setProperty('--indent', dotCount);

        // Conditional action buttons for Trash vs Active logs
        let actionsHtml = '';
        if (currentFolder === 'trash') {
          actionsHtml = `
            <span class="action-group">
              <button class="action-btn" onclick="performAction('restore', '${log.uid}')">[restore]</button>
              <button class="action-btn delete-btn" onclick="performAction('delete_permanent', '${log.uid}')">[permanent delete]</button>
            </span>
          `;
        } else {
          actionsHtml = `
            <span class="action-group">
              <button class="action-btn" onclick="startEdit('${log.uid}')">[edit]</button>
              <button class="action-btn delete-btn" onclick="performAction('trash', '${log.uid}')">[delete]</button>
            </span>
          `;
        }

        article.innerHTML = `
          <div class="log-meta">
            <span class="log-id">${isTractatus ? log.id : '•'}</span>
            <span class="log-date">${displayDate}</span>
          </div>
          <div class="log-content">
            <span>${log.content.replace(/\n/g, '<br>')}</span>
            ${actionsHtml}
          </div>
        `;
        stream.appendChild(article);
      });
    }

    // Start Edit Mode
    function startEdit(uid) {
      const log = allLogs.find(l => l.uid === uid);
      if (!log) return;

      document.getElementById('editingUid').value = log.uid;
      document.getElementById('logId').value = log.id || '';
      document.getElementById('logContent').value = log.content || '';
      
      document.getElementById('editor-title').innerText = "EDIT ENTRY";
      document.getElementById('submitBtn').innerText = "Update Entry";
      document.getElementById('cancel-edit').style.display = "inline";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetEditor() {
      document.getElementById('editingUid').value = '';
      document.getElementById('logId').value = '';
      document.getElementById('logContent').value = '';
      
      document.getElementById('editor-title').innerText = "NEW ENTRY";
      document.getElementById('submitBtn').innerText = "Publish Entry";
      document.getElementById('cancel-edit').style.display = "none";
    }

    // Single unified function for Save / Edit / Trash / Restore / Permanent Delete
    async function performAction(actionType, targetUid) {
      const password = document.getElementById('secretCode').value;
      if (!password) {
        alert("Please enter Secret Key in the form above.");
        document.getElementById('secretCode').focus();
        return;
      }

      if (actionType === 'delete_permanent' && !confirm("Permanently delete this entry? This cannot be undone.")) {
        return;
      }

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            action: actionType,
            uid: targetUid
          })
        });

        if (response.ok) {
          const resData = await response.json();
          allLogs = resData.logs;
          renderStream();
        } else {
          alert("Error: Incorrect password or action failed.");
        }
      } catch (err) {
        alert("Network error.");
      }
    }

    async function saveLog() {
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('secretCode').value;
      const uid = document.getElementById('editingUid').value;
      const id = document.getElementById('logId').value;
      const content = document.getElementById('logContent').value;

      if (!password || !content) {
        alert("Please enter both Secret Key and Content.");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      const now = new Date();
      const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password,
            action: 'save',
            uid: uid || Date.now().toString(),
            id,
            content,
            date: dateStr,
            updatedAt: uid ? dateStr : null
          })
        });

        if (response.ok) {
          const resData = await response.json();
          allLogs = resData.logs;
          renderStream();
          resetEditor();
        } else {
          alert("Error: Incorrect password or save failed.");
        }
      } catch (err) {
        alert("Network error.");
      } finally {
        btn.innerText = uid ? "Update Entry" : "Publish Entry";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
