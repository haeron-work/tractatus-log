<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tractatus Log</title>
  <style>
    /* 색상 및 폰트 설정 (다크모드 지원) */
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --dim-color: #888888;
      --accent-color: #2c2c2c;
      --line-height: 1.8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --dim-color: #666666;
        --accent-color: #4ea8de;
      }
    }

    body {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: var(--line-height);
    }

    /* 에디터 공간 */
    .editor-box {
      border: 1px dashed var(--dim-color);
      padding: 15px;
      margin-bottom: 50px;
      border-radius: 4px;
    }
    .editor-box input, .editor-box textarea, .editor-box button {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--dim-color);
      color: var(--text-color);
      padding: 8px;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .editor-box button {
      background: var(--text-color);
      color: var(--bg-color);
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    /* 기록 타임라인 아이템 */
    .log-item {
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      /* 점 개수에 따른 자동 들여쓰기 */
      padding-left: calc(var(--indent, 0) * 24px); 
    }

    /* 메타데이터 (id 상단 + date 하단 묶음) */
    .log-meta {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 12px;
      line-height: 1.2;
      flex-shrink: 0;
      margin-top: 4px;
      user-select: none;
    }
    .log-id { font-size: 0.7rem; color: var(--accent-color); font-weight: bold; }
    .log-date { font-size: 0.55rem; color: var(--dim-color); }
    .log-text { font-size: 1rem; }
  </style>
</head>
<body>

  <!-- 에디터 영역 (비밀번호 검증) -->
  <section class="editor-box">
    <input type="password" id="secretCode" placeholder="비밀 보안 코드" />
    <input type="text" id="logId" placeholder="논고 번호 (예: 1.11)" />
    <textarea id="logContent" rows="3" placeholder="기록할 아이디어를 적으세요..."></textarea>
    <button onclick="addLog()" id="submitBtn">기록하기 (Publish)</button>
  </section>

  <!-- 기록이 출력될 공간 -->
  <main id="logStream"></main>

  <script>
    // 🔴 [필수 수정] 1. 본인의 Cloudflare Worker 주소
    const WORKER_URL = "https://log-proxy.seashine-49f.workers.dev/";
    
    // 🔴 [필수 수정] 2. 본인의 GitHub 아이디 (데이터 불러오기용)
    const GITHUB_USERNAME = "haeron-work"; 
    const GITHUB_REPO = "tractatus-log";
    
    // 페이지 접속 시 기존 글 불러오기
    document.addEventListener("DOMContentLoaded", fetchLogs);

    async function fetchLogs() {
      const dataUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/logs.json`;
      try {
        // 캐시 무시를 위해 현재 시간 타임스탬프 추가
        const res = await fetch(dataUrl + `?t=${new Date().getTime()}`);
        if (!res.ok) return; // 첫 생성시 에러 무시
        const logs = await res.json();
        
        const stream = document.getElementById('logStream');
        stream.innerHTML = ''; // 초기화
        
        logs.forEach(log => renderLog(log.id, log.date, log.content));
      } catch (e) {
        console.log("데이터를 불러오지 못했습니다.", e);
      }
    }

    // 화면에 글 하나 그리기 함수
    function renderLog(id, dateStr, content) {
      const stream = document.getElementById('logStream');
      const dotCount = (id.match(/\./g) || []).length;
      
      const newLog = document.createElement('article');
      newLog.className = 'log-item';
      newLog.style.setProperty('--indent', dotCount);

      newLog.innerHTML = `
        <div class="log-meta">
          <span class="log-id">${id}</span>
          <span class="log-date">${dateStr}</span>
        </div>
        <span class="log-text">${content.replace(/\n/g, '<br>')}</span>
      `;
      // 가장 최근 글이 맨 아래로 붙도록 처리 (appendChild)
      stream.appendChild(newLog);
    }

    // 작성 버튼 클릭 시 처리
    async function addLog() {
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('secretCode').value;
      const id = document.getElementById('logId').value;
      const content = document.getElementById('logContent').value;

      if (!password || !id || !content) {
        alert("모든 필드를 입력해주세요.");
        return;
      }

      btn.innerText = "저장 중...";
      btn.disabled = true;

      const now = new Date();
      const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      try {
        // Cloudflare Worker로 데이터 전송
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, id, content, date: dateStr })
        });

        if (response.ok) {
          // 화면에 즉시 새 글 추가
          renderLog(id, dateStr, content);
          document.getElementById('logContent').value = '';
          document.getElementById('logId').value = '';
          alert("성공적으로 저장되었습니다.");
        } else {
          alert("오류: 비밀번호가 틀렸거나 저장에 실패했습니다.");
        }
      } catch (err) {
        alert("통신 오류가 발생했습니다.");
      } finally {
        btn.innerText = "기록하기 (Publish)";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
