<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tractatus Log & Scratchpad</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --dim-color: #888888;
      --accent-color: #000000;
      --border-color: #e0e0e0;
      --line-height: 1.8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #121212;
        --text-color: #e0e0e0;
        --dim-color: #666666;
        --accent-color: #4ea8de;
        --border-color: #2a2a2a;
      }
    }

    body {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: var(--line-height);
    }

    /* Minimal Folder Switcher */
    nav.folder-tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    nav.folder-tabs button {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--dim-color);
      cursor: pointer;
      padding: 0;
    }
    nav.folder-tabs button.active {
      color: var(--text-color);
      font-weight: bold;
      text-decoration: underline;
    }

    /* Minimal Editor */
    .editor-box {
      border: 1px dashed var(--dim-color);
      padding: 15px;
      margin-bottom: 40px;
      border-radius: 2px;
    }
    .editor-box input, .editor-box textarea, .editor-box button {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px;
      margin-bottom: 8px;
      width: 100%;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    .editor-box button {
      background: var(--text-color);
      color: var(--bg-color);
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 4px;
    }
    .editor-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--dim-color);
      margin-bottom: 8px;
    }

    /* Log Stream Item */
    .log-item {
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      padding-left: calc(var(--indent, 0) * 22px);
    }
    .log-meta {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: 12px;
      line-height: 1.2;
      flex-shrink: 0;
      margin-top: 3px;
      user-select: none;
    }
    .log-id { font-size: 0.7rem; color: var(--accent-color); font-weight: bold; }
    .log-date { font-size: 0.55rem; color: var(--dim-color); }
    .log-content { font-size: 0.95rem; flex-grow: 1; }
    
    /* Edit Action Button */
    .edit-btn {
      background: none;
      border: none;
      color: var(--dim-color);
      font-size: 0.65rem;
      cursor: pointer;
      padding: 0;
      margin-left: 8px;
      opacity: 0.3;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .log-item:hover .edit-btn { opacity: 1; }
  </style>
</head>
<body>

  <!-- Minimal Folder Filter Navigation -->
  <nav class="folder-tabs">
    <button id="tab-all" class="active" onclick="switchFolder('all')">[ ALL ]</button>
    <button id="tab-tractatus" onclick="switchFolder('tractatus')">[ TRACTATUS ]</button>
    <button id="tab-scratchpad" onclick="switchFolder('scratchpad')">[ SCRATCHPAD ]</button>
  </nav>

  <!-- Editor Section -->
  <section class="editor-box">
    <div class="editor-header">
      <span id="editor-title">NEW ENTRY</span>
      <span id="cancel-edit" style="display:none; cursor:pointer;" onclick="resetEditor()">[ Cancel Edit ]</span>
    </div>
    <input type="hidden" id="editingUid" value="" />
    <input type="password" id="secretCode" placeholder="Secret Key" />
    <input type="text" id="logId" placeholder="No. (e.g. 1.11 — leave blank for Scratchpad)" />
    <textarea id="logContent" rows="3" placeholder="Write an idea or note..."></textarea>
    <button onclick="saveLog()" id="submitBtn">Publish Entry</button>
  </section>

  <!-- Timeline Stream -->
  <main id="logStream"></main>

  <script>
    // 🔴 [CONFIG] Replace with your actual URLs/Info
    const WORKER_URL = "https://log-proxy.haeron-work.workers.dev";
    const GITHUB_USERNAME = "haeron-work";
    const GITHUB_REPO = "tractatus-log";

    let allLogs = [];
    let currentFolder = 'all';

    document.addEventListener("DOMContentLoaded", fetchLogs);

    async function fetchLogs() {
      const dataUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/logs.json`;
      try {
        const res = await fetch(dataUrl + `?t=${new Date().getTime()}`);
        if (!res.ok) return;
        allLogs = await res.json();
        renderStream();
      } catch (e) {
        console.error("Failed to load logs.", e);
      }
    }

    function switchFolder(folder) {
      currentFolder = folder;
      document.querySelectorAll('.folder-tabs button').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${folder}`).classList.add('active');
      renderStream();
    }

    function renderStream() {
      const stream = document.getElementById('logStream');
      stream.innerHTML = '';

      const filteredLogs = allLogs.filter(log => {
        const isTractatus = log.id && log.id.trim() !== '';
        if (currentFolder === 'tractatus') return isTractatus;
        if (currentFolder === 'scratchpad') return !isTractatus;
        return true; // 'all'
      });

      filteredLogs.forEach(log => {
        const isTractatus = log.id && log.id.trim() !== '';
        const dotCount = isTractatus ? (log.id.match(/\./g) || []).length : 0;
        
        // Use updatedAt if present, otherwise use initial date
        const displayDate = log.updatedAt ? `upd ${log.updatedAt}` : log.date;

        const article = document.createElement('article');
        article.className = 'log-item';
        article.style.setProperty('--indent', dotCount);

        article.innerHTML = `
          <div class="log-meta">
            <span class="log-id">${isTractatus ? log.id : '•'}</span>
            <span class="log-date">${displayDate}</span>
          </div>
          <div class="log-content">
            <span>${log.content.replace(/\n/g, '<br>')}</span>
            <button class="edit-btn" onclick="startEdit('${log.uid}')">[edit]</button>
          </div>
        `;
        stream.appendChild(article);
      });
    }

    function startEdit(uid) {
      const log = allLogs.find(l => l.uid === uid);
      if (!log) return;

      document.getElementById('editingUid').value = log.uid;
      document.getElementById('logId').value = log.id || '';
      document.getElementById('logContent').value = log.content || '';
      
      document.getElementById('editor-title').innerText = "EDIT ENTRY";
      document.getElementById('submitBtn').innerText = "Update Entry";
      document.getElementById('cancel-edit').style.display = "inline";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetEditor() {
      document.getElementById('editingUid').value = '';
      document.getElementById('logId').value = '';
      document.getElementById('logContent').value = '';
      
      document.getElementById('editor-title').innerText = "NEW ENTRY";
      document.getElementById('submitBtn').innerText = "Publish Entry";
      document.getElementById('cancel-edit').style.display = "none";
    }

    async function saveLog() {
      const btn = document.getElementById('submitBtn');
      const password = document.getElementById('secretCode').value;
      const uid = document.getElementById('editingUid').value;
      const id = document.getElementById('logId').value;
      const content = document.getElementById('logContent').value;

      if (!password || !content) {
        alert("Please enter both Secret Key and Content.");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      const now = new Date();
      const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const payload = {
        password,
        uid: uid || Date.now().toString(),
        id,
        content,
        date: dateStr,
        updatedAt: uid ? dateStr : null // Set updatedAt only if editing
      };

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          // Local State Sync
          const index = allLogs.findIndex(l => l.uid === payload.uid);
          if (index > -1) {
            allLogs[index] = { ...allLogs[index], id, content, updatedAt: dateStr };
          } else {
            allLogs.push({ uid: payload.uid, id, content, date: dateStr });
          }

          renderStream();
          resetEditor();
          alert("Successfully saved.");
        } else {
          alert("Error: Incorrect password or save failed.");
        }
      } catch (err) {
        alert("Network error.");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
